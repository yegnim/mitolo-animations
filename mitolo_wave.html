  <text id="ct" x="260" y="279"
        text-anchor="middle"
        font-family="'Gill Sans', 'Century Gothic', 'Optima', sans-serif"
        font-size="14" letter-spacing="7"
        fill="#1a1714" opacity="0">COMPLETED</text>
</svg>

<script>
  const wr = document.getElementById('wr');
  const ct = document.getElementById('ct');
  const DURATION = 6000;
  const WAVE_W = 130;
  const START = 50 - WAVE_W - 60;
  const END = 470 + WAVE_W + 60;
  let t0 = null, done = false;

  function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

  function tick(ts) {
    if (!t0) t0 = ts;
    const el = ts - t0;
    if (!done) {
      const raw = Math.min(el / DURATION, 1);
      const x = START + (END - START) * ease(raw);
      wr.setAttribute('x', x.toFixed(1));
      if (raw < 1) { requestAnimationFrame(tick); return; }
      done = true;
      wr.setAttribute('x', (END + 300).toString());
    }
    const fadeT = Math.min((el - DURATION) / 900, 1);
    if (fadeT >= 0) {
      ct.setAttribute('opacity', ease(Math.max(0, fadeT)).toFixed(3));
      if (fadeT < 1) requestAnimationFrame(tick);
    }
  }
  requestAnimationFrame(tick);
</script>
